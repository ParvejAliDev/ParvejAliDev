<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Background -->
  <rect width="400" height="240" rx="12" fill="#1a1b27" stroke="#38bdae" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="400" height="38" rx="12" fill="#1f2335"/>
  <rect x="0" y="26" width="400" height="12" fill="#1f2335"/>
  <circle cx="20" cy="19" r="5" fill="#f7768e"/>
  <circle cx="36" cy="19" r="5" fill="#e0af68"/>
  <circle cx="52" cy="19" r="5" fill="#9ece6a"/>
  <text x="75" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#70a5fd">Commerce Ops Suite • Operations Dashboard</text>
  
  <!-- Metrics Cards Row -->
  <g transform="translate(16, 52)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="112" height="48" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
    <text x="10" y="18" font-family="sans-serif" font-size="10" fill="#a9b1d6">Active Orders</text>
    <text x="10" y="36" font-family="sans-serif" font-size="15" font-weight="700" fill="#7aa2f7">1,482</text>
    
    <!-- Metric 2 -->
    <rect x="124" y="0" width="112" height="48" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
    <text x="134" y="18" font-family="sans-serif" font-size="10" fill="#a9b1d6">Cache &amp; DB Status</text>
    <text x="134" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#9ece6a">Redis / PG OK</text>
    
    <!-- Metric 3 -->
    <rect x="248" y="0" width="120" height="48" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
    <text x="258" y="18" font-family="sans-serif" font-size="10" fill="#a9b1d6">Permissions</text>
    <text x="258" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#bb9af7">Role-Aware</text>
  </g>
  
  <!-- Simulated Data Table -->
  <g transform="translate(16, 114)">
    <rect x="0" y="0" width="368" height="78" rx="6" fill="#1f2335"/>
    <!-- Table Header -->
    <rect x="0" y="0" width="368" height="24" rx="6" fill="#292e42"/>
    <text x="12" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#7aa2f7">ORDER ID</text>
    <text x="110" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#7aa2f7">MODULE</text>
    <text x="210" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#7aa2f7">STATE</text>
    <text x="300" y="16" font-family="sans-serif" font-size="10" font-weight="600" fill="#7aa2f7">LATENCY</text>

    <!-- Row 1 -->
    <text x="12" y="42" font-family="monospace" font-size="10" fill="#c0caf5">#ORD-9021</text>
    <text x="110" y="42" font-family="sans-serif" font-size="10" fill="#a9b1d6">Inventory</text>
    <rect x="210" y="31" width="56" height="15" rx="3" fill="#9ece6a" fill-opacity="0.2"/>
    <text x="217" y="42" font-family="sans-serif" font-size="9" font-weight="600" fill="#9ece6a">SYNCED</text>
    <text x="300" y="42" font-family="monospace" font-size="10" fill="#73daca">14 ms</text>

    <!-- Row 2 -->
    <text x="12" y="65" font-family="monospace" font-size="10" fill="#c0caf5">#ORD-9022</text>
    <text x="110" y="65" font-family="sans-serif" font-size="10" fill="#a9b1d6">Reports</text>
    <rect x="210" y="54" width="65" height="15" rx="3" fill="#7aa2f7" fill-opacity="0.2"/>
    <text x="216" y="65" font-family="sans-serif" font-size="9" font-weight="600" fill="#7aa2f7">RENDERED</text>
    <text x="300" y="65" font-family="monospace" font-size="10" fill="#73daca">8 ms</text>
  </g>
  
  <!-- Footer Tech Badges -->
  <g transform="translate(16, 204)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#292e42"/>
    <text x="10" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#7aa2f7">Next.js</text>
    
    <rect x="68" y="0" width="76" height="20" rx="4" fill="#292e42"/>
    <text x="78" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#bb9af7">PostgreSQL</text>
    
    <rect x="152" y="0" width="48" height="20" rx="4" fill="#292e42"/>
    <text x="162" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#f7768e">Redis</text>
    
    <rect x="208" y="0" width="102" height="20" rx="4" fill="#292e42"/>
    <text x="218" y="14" font-family="sans-serif" font-size="10" font-weight="600" fill="#73daca">Docker Compose</text>
  </g>
</svg>
